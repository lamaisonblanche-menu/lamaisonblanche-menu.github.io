<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demande envoyée · La Maison Blanche</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&display=swap">
<style>
:root { --ink: #111111; --paper: #ffffff; --muted: #6d6d6d; --line: #e4e3df; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
body { font-family: "Jost", "Futura", "Avenir Next", "Segoe UI", sans-serif; font-weight: 300; font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; padding: max(48px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(48px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; justify-items: center; text-align: center; }
.logo { width: 150px; height: auto; }
.label { font-size: 11px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); margin: 18px 0 0; }
h1 { font-family: "Marcellus", "Optima", Georgia, serif; font-weight: 400; font-size: clamp(32px, 7vw, 44px); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
dl { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 8px 22px; margin: 0; padding-block: 18px; border-block: 1px solid var(--line); text-align: left; font-size: 15px; }
dt { color: var(--muted); }
dd { margin: 0; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 28px; font: 500 12px/1 "Jost", sans-serif; letter-spacing: .24em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--ink); color: var(--ink); }
.btn-solid { background: var(--ink); color: var(--paper); }
a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <a href="./"><img class="logo" src="logo.png" alt="La Maison Blanche"></a>
  <p class="label">Demande envoyée</p>
  <h1>Merci, votre demande est bien reçue</h1>
  <p class="muted">Notre équipe vous appelle pour confirmer votre table. Votre réservation n’est valable qu’après cette confirmation.</p>
  <dl id="recap" hidden></dl>
  <p id="wa-txt" hidden>Pour aller plus vite, envoyez aussi votre demande sur WhatsApp.</p>
  <div class="actions">
    <a class="btn btn-solid" id="wa" href="https://wa.me/213541559672" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>
    <a class="btn" href="./">Retour au site</a>
  </div>
</main>
<script>
(function () {
  var d = null;
  try { d = JSON.parse(sessionStorage.getItem("resa") || "null"); } catch (e) {}
  if (!d) return;
  var dl = document.getElementById("recap");
  d.rows.forEach(function (r) {
    var dt = document.createElement("dt"); dt.textContent = r[0];
    var dd = document.createElement("dd"); dd.textContent = r[1];
    dl.appendChild(dt); dl.appendChild(dd);
  });
  dl.hidden = false;
  document.getElementById("wa-txt").hidden = false;
  if (d.wa) document.getElementById("wa").href = d.wa;
})();
</script>
</body>
</html>
